<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0807">
<title>Love Reading — Kusniyatin × Firdaus</title>
<style>
:root {
  --bg:#080605; --panel:rgba(20,14,10,.92); --gold:#c99b57; --gold2:#f0d09a;
  --cream:#f3e6d2; --muted:#bda98e; --line:rgba(201,155,87,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#21150e 0,#0b0807 38%,#050404 100%);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
button{font:inherit}
#lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 50% 35%,rgba(104,67,28,.28),transparent 32%),#070504}
.lock-card{width:min(430px,100%);padding:34px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(28,19,13,.98),rgba(9,7,6,.98));box-shadow:0 30px 80px #000}
.moon{font-size:42px;text-align:center;margin-bottom:8px}
.kicker{text-align:center;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-size:11px}
h1{text-align:center;font-size:28px;font-weight:400;margin:12px 0 8px}
.lock-sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px}
input{width:100%;padding:14px 16px;border-radius:13px;border:1px solid var(--line);background:#0d0a08;color:var(--cream);outline:none;font-size:16px}
input:focus{border-color:var(--gold)}
.enter{width:100%;margin-top:12px;padding:13px;border:1px solid var(--gold);border-radius:13px;background:linear-gradient(180deg,#2a1d12,#17100c);color:var(--gold2);cursor:pointer}
.err{min-height:20px;color:#d99b7f;text-align:center;font-size:12px;margin-top:10px}
#app{display:none;min-height:100vh}
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);background:rgba(6,5,4,.78);border-bottom:1px solid rgba(201,155,87,.22)}
.bar{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:auto;padding:0 14px}
.brand{color:var(--gold2);letter-spacing:.12em;font-size:12px;text-transform:uppercase;white-space:nowrap}
.controls{display:flex;gap:7px;align-items:center}
.pdf-btn{height:38px;padding:0 12px;border:1px solid var(--gold);border-radius:11px;background:linear-gradient(180deg,#2a1d12,#17100c);color:var(--gold2);cursor:pointer;font-size:12px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#100c09;color:var(--gold2);cursor:pointer}
.main{max-width:1100px;margin:auto;padding:22px 12px 80px}
.viewer{position:relative;display:flex;justify-content:center;min-height:60vh}
.page-wrap{position:relative;max-width:864px;width:min(100%,864px);border:1px solid rgba(201,155,87,.3);box-shadow:0 35px 90px rgba(0,0,0,.65);background:#0b0807}
.page-wrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0}
.nav button{border:1px solid var(--line);background:rgba(17,11,8,.92);color:var(--gold2);border-radius:13px;padding:11px 18px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.counter{min-width:92px;text-align:center;color:var(--muted);font-size:13px}
.progress{height:2px;background:#1d140e;max-width:864px;margin:0 auto 20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:8.333%;transition:width .25s}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.thumb{flex:0 0 68px;border:1px solid rgba(201,155,87,.22);padding:0;background:#0d0907;cursor:pointer;opacity:.58;border-radius:7px;overflow:hidden}
.thumb.active{opacity:1;border-color:var(--gold)}
.thumb img{display:block;width:100%;height:112px;object-fit:cover;object-position:top}
.hint{text-align:center;color:#8f7d67;font-size:11px;margin-top:12px;letter-spacing:.04em}
@media(max-width:600px){
 .bar{height:58px} .brand{font-size:10px} .main{padding-top:10px}
 .page-wrap{border-left:0;border-right:0} .nav{gap:8px}
 .nav button{padding:10px 13px} .hint{font-size:10px}
}
</style>
</head>
<body>
<section id="lock">
  <div class="lock-card">
    <div class="moon">☾</div>
    <div class="kicker">Private Love Reading</div>
    <h1>Kusniyatin × Firdaus</h1>
    <div class="lock-sub">Masukkan password untuk membuka reading.</div>
    <input id="pw" type="password" autocomplete="off" placeholder="Password">
    <button class="enter" id="enter">Buka Reading</button>
    <div class="err" id="err"></div>
  </div>
</section>

<div id="app">
  <header class="top">
    <div class="bar">
      <div class="brand">Tarot Sarah · Love Reading</div>
      <div class="controls">
        <button class="pdf-btn" id="pdfBtn" title="Download PDF">⇩ PDF</button>
        <button class="icon-btn" id="fs" title="Fullscreen">⛶</button>
        <button class="icon-btn" id="lockBtn" title="Kunci kembali">⌕</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="viewer" id="viewer">
      <div class="page-wrap">
        <img id="page" src="assets/page-01.png" alt="Love Reading halaman 1">
      </div>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="nav">
      <button id="prev">← Sebelumnya</button>
      <div class="counter" id="counter">1 / 12</div>
      <button id="next">Berikutnya →</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div class="hint">Geser kiri/kanan di gambar · tombol ← → di keyboard · ⇩ PDF untuk simpan sebagai PDF</div>
  </main>
</div>

<script>
const HASH = "96509c079afa3b8ff9f6fdf23bc7968735c666bc77d62b1ae6272fcc26a7776a";
const TOTAL = 12;
let current = 1;

async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
function openApp(){
  document.getElementById("lock").style.display="none";
  document.getElementById("app").style.display="block";
  sessionStorage.setItem("readingUnlocked","1");
}
function lockApp(){
  document.getElementById("app").style.display="none";
  document.getElementById("lock").style.display="grid";
  document.getElementById("pw").value="";
  sessionStorage.removeItem("readingUnlocked");
}
document.getElementById("enter").onclick=async()=>{
  const v=document.getElementById("pw").value;
  if(await sha256(v)===HASH){openApp();}
  else document.getElementById("err").textContent="Password salah. Coba lagi.";
};
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("enter").click()});
document.getElementById("lockBtn").onclick=lockApp;

const page=document.getElementById("page"), counter=document.getElementById("counter"), prog=document.getElementById("prog"), thumbs=document.getElementById("thumbs");
for(let i=1;i<=TOTAL;i++){
  const b=document.createElement("button"); b.className="thumb";
  b.innerHTML=`<img src="assets/page-${String(i).padStart(2,"0")}.png" alt="Halaman ${i}">`;
  b.onclick=()=>show(i); thumbs.appendChild(b);
}
function show(n){
  current=Math.max(1,Math.min(TOTAL,n));
  page.src=`assets/page-${String(current).padStart(2,"0")}.png`;
  page.alt=`Love Reading halaman ${current}`;
  counter.textContent=`${current} / ${TOTAL}`;
  prog.style.width=`${current/TOTAL*100}%`;
  [...thumbs.children].forEach((x,i)=>x.classList.toggle("active",i===current-1));
  const active=thumbs.children[current-1];
  if(active) active.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("prev").onclick=()=>show(current-1);
document.getElementById("next").onclick=()=>show(current+1);
document.addEventListener("keydown",e=>{
 if(document.getElementById("app").style.display!=="block") return;
 if(e.key==="ArrowLeft")show(current-1);
 if(e.key==="ArrowRight" || e.key===" "){e.preventDefault();show(current+1)}
});
document.getElementById("pdfBtn").onclick=()=>{
  const pages = Array.from({length: TOTAL}, (_,i)=>`assets/page-${String(i+1).padStart(2,"0")}.png`);
  const w = window.open("", "_blank");
  if(!w){ alert("Popup diblokir browser. Izinkan popup untuk membuat PDF."); return; }

  w.document.write(`<!doctype html><html><head><meta charset="utf-8">
  <title>Love Reading — Kusniyatin × Firdaus</title>
  <style>
    @page{size:A4 portrait;margin:0}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#000}
    .sheet{width:210mm;height:297mm;display:flex;align-items:center;justify-content:center;page-break-after:always;break-after:page;background:#000}
    .sheet:last-child{page-break-after:auto;break-after:auto}
    img{width:100%;height:100%;object-fit:contain;display:block}
    @media print{.sheet{break-after:page}.sheet:last-child{break-after:auto}}
  </style></head><body>`);

  pages.forEach((src,i)=>{
    w.document.write(`<div class="sheet"><img src="${src}" alt="Love Reading halaman ${i+1}"></div>`);
  });

  w.document.write(`</body></html>`);
  w.document.close();
  w.focus();

  // Menunggu gambar selesai dimuat sebelum membuka dialog PDF.
  const imgs = [...w.document.images];
  Promise.all(imgs.map(img => img.complete ? Promise.resolve() :
    new Promise(resolve => { img.onload=img.onerror=resolve; })))
    .then(()=>setTimeout(()=>w.print(),300));
};

document.getElementById("fs").onclick=()=>{
 const el=document.documentElement;
 if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
};
let sx=0;
document.getElementById("viewer").addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
document.getElementById("viewer").addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].screenX-sx;
 if(Math.abs(dx)>45) show(current+(dx<0?1:-1));
},{passive:true});
show(1);
</script>
</body>
</html>
